name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The Go and Python test suites are part of the exercise, so CI does not run them.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Install scripts are where hijacked releases run their payload.
      - name: install
        run: npm ci --ignore-scripts
      - name: test
        run: npm test
      - name: build
        run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install
        run: "pip install --only-binary=:all: -r requirements.txt"
      - name: collect tests
        run: python -m pytest --collect-only -q
