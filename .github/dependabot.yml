version: 2
updates:
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Hold fresh releases back so a hijacked version is caught and pulled
    # upstream before it reaches a PR. Security updates skip the cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
